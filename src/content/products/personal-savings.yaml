title: "Savings, CDs & IRAs"
published: "As published on the Savings / CDs / IRAs Comparison Chart"
products:
  - id: "personal-savings"
    name: "Personal Savings"
    tagline: "Your money stays within reach"
    best_for: "Emergency funds and everyday saving — start with $100"
    monthly_fee: "$3 or $0"
    fee_note: "The fee is waived any quarter your balance stays at or above $200"
    min_opening: "$100"
    interest: true
    highlights:
      - "Withdraw whenever life happens — no penalties for using your own money"
      - "Interest paid every quarter, automatically"
      - "Free online banking and mobile deposit"
      - "Open with as little as $100"
    qualify: []
    details:
      - "You must maintain a minimum balance of $100.00 in the account each day to obtain the disclosed annual percentage yield. Interest is compounded and credited every quarter."
      - "The $3.00 monthly service charge applies for each month of the quarterly statement cycle in which your average daily balance falls below $200.00."
      - "Transfers to third parties by check, point-of-sale, or TGB online are prohibited. A $5.00 debit fee applies to each debit beyond 5 per month (electronic payments, transfers between your TGB accounts, and ATM withdrawals excluded). No other transaction limitations apply."
    open_url: "https://app.loanspq.com/apply.aspx?enc=Kw21Wblm1yxpjJabdoZaD_1XCeB6DUzWcPY_g38Z9Jqr0clsjQUYVmTraoEngafVkCgQedLZhb-S5_xgQhN9fA"
    details_url: "https://www.texasgulfbank.com/savings-cds-iras-comparison-chart/#sand-dollar"

  - id: "certificate-of-deposit"
    name: "Certificate of Deposit"
    tagline: "Pick a date. Lock in the rate."
    best_for: "Money with a job but no deadline — tuition in three years, a down payment in five"
    monthly_fee: "$0"
    fee_note: "No monthly service charge, ever"
    min_opening: "$2,500"
    interest: true
    highlights:
      - "Your rate is locked for the entire term — market dips can't touch it"
      - "Choose from terms of 30 days to 5 years"
      - "Interest compounds monthly"
      - "10-day grace window when your term ends — rethink, renew, or withdraw"
    qualify: []
    details:
      - "A fixed rate is locked for the full term. Upon maturity and renewal, the rate is set to be competitive with current market rates at that time."
      - "No deposits may be made before maturity, and no withdrawals of principal before maturity — a penalty may apply for early withdrawal (equal to 7 days', 1 month's, 6 months', or 12 months' interest depending on the original term)."
      - "You can withdraw accrued interest before maturity without penalty."
      - "At maturity you have a 10-calendar-day grace period to withdraw funds without penalty."
    open_url: "https://app.loanspq.com/apply.aspx?enc=Kw21Wblm1yxpjJabdoZaD_1XCeB6DUzWcPY_g38Z9Jqr0clsjQUYVmTraoEngafVkCgQedLZhb-S5_xgQhN9fA"
    details_url: "https://www.texasgulfbank.com/savings-cds-iras-comparison-chart/#cert-deposit"

  - id: "ira"
    name: "Individual Retirement Account"
    tagline: "Future you says thanks"
    best_for: "Retirement savings with real tax advantages — on top of any workplace plan"
    monthly_fee: "$0"
    fee_note: "No monthly service charge"
    min_opening: "$1,000 variable / $2,000 fixed"
    interest: true
    highlights:
      - "Contribute up to $7,000 a year ($8,000 once you turn 50)"
      - "Choose a variable rate for flexibility or fixed for certainty"
      - "Add to it anytime — deposits of $50 or more, as often as you like"
      - "Your spouse can open their own and do the same"
    qualify: []
    details:
      - "Contribution limits: up to $7,000.00 each per year for individuals under 50, up to $8,000.00 for age 50 and over (tax year 2025) — even if you already participate in an employer-sponsored plan."
      - "A penalty may be imposed for withdrawals before maturity. In addition, a separate IRS penalty may apply for withdrawals prior to age 59½."
      - "Variable-rate IRAs accept unlimited additional deposits of $50.00 or more. Fixed-rate IRAs accept no deposits before maturity."
      - "At maturity you have a 10-calendar-day grace period to withdraw funds without penalty. Consult your tax advisor about how an IRA fits your situation."
    open_url: "https://www.texasgulfbank.com/contact-texas-gulf-bank/"
    details_url: "https://www.texasgulfbank.com/savings-cds-iras-comparison-chart/#IRAs"

  - id: "money-market"
    name: "Personal Money Market"
    tagline: "Bigger balance, better rate. That's the deal."
    best_for: "$500+ sitting in checking that should be earning more"
    monthly_fee: "$10 or $0"
    fee_note: "Waived with a $5,000 average daily balance"
    min_opening: "$500"
    interest: true
    highlights:
      - "Five rate tiers — climb from 0.55% all the way to 1.66% APY"
      - "When you cross into a higher tier, your whole balance earns the better rate"
      - "No lock-up — your money stays available"
      - "Free online banking & mobile deposit"
    details:
      - "Tiered rates apply to your entire daily balance: 0.55% APY from $0.01, stepping up through $40K / $100K / $500K tiers to 1.66% APY at $1,000,000 and above. See current rates below."
      - "Transfers to third parties by point-of-sale (including mobile wallet debit payments) are prohibited. A $10.00 fee applies to each debit beyond 10 per monthly statement cycle (electronic payments, transfers between your TGB accounts, and ATM withdrawals excluded)."
      - "Rates are variable and may change after the account is opened. Fees may reduce earnings."
    open_url: "https://app.loanspq.com/apply.aspx?enc=Kw21Wblm1yxpjJabdoZaD_1XCeB6DUzWcPY_g38Z9Jqr0clsjQUYVmTraoEngafVkCgQedLZhb-S5_xgQhN9fA"
    details_url: "https://www.texasgulfbank.com/personal-comparison-chart/#Gulf-Stream-Money-Market-Addtl-Info"

compare_rows:
  - label: "Minimum opening deposit"
    values: ["$100", "$2,500", "$1,000 variable / $2,000 fixed", "$500"]
  - label: "Monthly service charge"
    values: ["$3 if avg daily balance under $200 that month", "$0", "$0", "$10 or $0*"]
  - label: "Minimum daily balance to earn interest"
    values: ["$100", "$2,500", "No minimum", "$5,000 to waive the fee; tiers set the rate"]
  - label: "Interest rate type"
    values: ["Variable", "Fixed for the term", "Variable or fixed", "Variable, tiered"]
  - label: "Interest compounding"
    values: ["Quarterly", "Monthly", "Quarterly", "Monthly"]
  - label: "Statement cycle"
    values: ["Quarterly", "N/A", "N/A", "Monthly"]
  - label: "Access to funds"
    values: ["Withdraw anytime (limits apply)", "At maturity — early-withdrawal penalty applies", "At maturity — early-withdrawal penalty may apply", "Withdraw anytime (limits apply)"]

# Secondary products shown as compact cards, not full panels
secondary:
  - id: "gulf-rewards-savings"
    name: "Gulf Rewards Savings"
    tagline: "The perk our best customers don't know they have"
    points:
      - "No monthly service charge. Not ever."
      - "A better rate than Personal Savings — just for being a Gulf Rewards Checking customer"
      - "Open it with $100"
      - "Everything on one easy-to-read statement"
    details:
      - "Available exclusively to Gulf Rewards Checking customers. Interest is compounded and credited monthly; maintain a $100.00 minimum daily balance to earn the disclosed APY."
    details_url: "https://www.texasgulfbank.com/savings-cds-iras-comparison-chart/#gulf-rewards"
  - id: "hsa"
    name: "Health Savings Account"
    tagline: "Triple tax advantage for medical expenses"
    points:
      - "Contributions are tax-deductible"
      - "Withdrawals for qualified medical expenses are tax-free"
      - "Unused funds roll over year to year — it's yours to keep"
      - "Tiered rates at $1,000 and $5,000 balances"
    details:
      - "Requires a high-deductible health plan. Interest is compounded and credited monthly; tiered rates apply at $1,000.00 and $5,000.00 minimum daily balances. A $3.00 monthly charge applies if your average daily balance falls below $1,000."
      - "The IRS has specific eligibility rules for opening and maintaining an HSA and for qualified medical expenses. Consult your tax advisor for how IRS rules affect you."
    details_url: "https://www.texasgulfbank.com/savings-cds-iras-comparison-chart/#health-savings"

disclaimer_short: "Early withdrawal penalties may apply to CDs and IRAs. *Advertised APYs reflect the highest available rate tier and may require qualifying balances or activity. Variable rates may change after account opening. Contact Texas Gulf Bank at 1-800-467-7216 for a Truth-In-Savings / Reg DD disclosure of terms, conditions, fees, and rate information."
